<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><text x="490.5" y="54" font-family="Arial" font-size="32" font-weight="700" fill="#211b2d">ER диаграмма библиотечной системы</text><rect x="100" y="125" width="570" height="280" rx="15" fill="#ffffff" stroke="#b18ad4" stroke-width="2"/><rect x="100" y="125" width="570" height="54" rx="15" fill="#f1e4ff" stroke="#b18ad4" stroke-width="2"/><text x="120" y="163" font-family="Arial" font-size="25" font-weight="700" fill="#211b2d">users — пользователи</text><text x="120" y="213" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">PK id : integer</text><text x="120" y="248" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">name : varchar(100)</text><text x="120" y="283" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">UK email : varchar(190)</text><text x="120" y="318" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">password_hash : varchar(255)</text><text x="120" y="353" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">role : reader | admin</text><text x="120" y="388" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">created_at : datetime</text><rect x="930" y="125" width="570" height="315" rx="15" fill="#ffffff" stroke="#b18ad4" stroke-width="2"/><rect x="930" y="125" width="570" height="54" rx="15" fill="#f1e4ff" stroke="#b18ad4" stroke-width="2"/><text x="950" y="163" font-family="Arial" font-size="25" font-weight="700" fill="#211b2d">books — книги и экземпляры</text><text x="950" y="213" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">PK id : integer</text><text x="950" y="248" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">title : varchar(200)</text><text x="950" y="283" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">author : varchar(150)</text><text x="950" y="318" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">genre : varchar(80)</text><text x="950" y="353" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">UK isbn : varchar(20)</text><text x="950" y="388" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">icon : varchar(12)</text><text x="950" y="423" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">created_at : datetime</text><rect x="100" y="665" width="570" height="280" rx="15" fill="#ffffff" stroke="#b18ad4" stroke-width="2"/><rect x="100" y="665" width="570" height="54" rx="15" fill="#f1e4ff" stroke="#b18ad4" stroke-width="2"/><text x="120" y="703" font-family="Arial" font-size="25" font-weight="700" fill="#211b2d">requests — заявки</text><text x="120" y="753" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">PK id : integer</text><text x="120" y="788" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">FK user_id → users.id</text><text x="120" y="823" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">FK book_id → books.id</text><text x="120" y="858" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">status : pending | approved | rejected | cancelled</text><text x="120" y="893" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">created_at : datetime</text><text x="120" y="928" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">resolved_at : datetime nullable</text><rect x="930" y="665" width="570" height="315" rx="15" fill="#ffffff" stroke="#b18ad4" stroke-width="2"/><rect x="930" y="665" width="570" height="54" rx="15" fill="#f1e4ff" stroke="#b18ad4" stroke-width="2"/><text x="950" y="703" font-family="Arial" font-size="25" font-weight="700" fill="#211b2d">loans — выдачи</text><text x="950" y="753" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">PK id : integer</text><text x="950" y="788" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">FK user_id → users.id</text><text x="950" y="823" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">FK book_id → books.id</text><text x="950" y="858" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">UK FK request_id → requests.id nullable</text><text x="950" y="893" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">FK issued_by → users.id</text><text x="950" y="928" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">issued_at / due_at : date</text><text x="950" y="963" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">returned_at : date nullable</text><polyline points="260,405 260,665" fill="none" stroke="#766585" stroke-width="2"/><text x="275" y="457" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">1</text><text x="275" y="642" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">0..N</text><text x="285" y="531" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">подает</text><polyline points="1310,440 1310,665" fill="none" stroke="#766585" stroke-width="2"/><text x="1325" y="492" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">1</text><text x="1325" y="642" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">0..N</text><text x="1335" y="561" font-family="Arial" font-size="21" font-weight="400" fill="#211b2d">выдается</text><polyline points="670,790 930,790" fill="none" stroke="#766585" stroke-width="2"/><text x="687" y="776" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">0..1</text><text x="853" y="776" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">0..1</text><text x="725" y="820" font-family="Arial" font-size="18" font-weight="400" fill="#211b2d">основание</text><polyline points="1130,440 1130,550 550,550 550,665" fill="none" stroke="#766585" stroke-width="2"/><text x="1145" y="482" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">1</text><text x="565" y="647" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">0..N</text><text x="750" y="576" font-family="Arial" font-size="18" font-weight="400" fill="#211b2d">книга в заявке</text><polyline points="670,230 770,230 770,610 1030,610 1030,665" fill="none" stroke="#766585" stroke-width="2"/><text x="684" y="218" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">1</text><text x="1040" y="647" font-family="Arial" font-size="22" font-weight="700" fill="#211b2d">0..N</text><text x="780" y="358" font-family="Arial" font-size="18" font-weight="400" fill="#211b2d">читатель</text><text x="780" y="388" font-family="Arial" font-size="18" font-weight="400" fill="#211b2d">и сотрудник</text><text x="377.5" y="1070" font-family="Arial" font-size="20" font-weight="400" fill="#211b2d">Ограничения: одна активная выдача на книгу; одна ожидающая заявка читателя на книгу.</text><text x="342.5" y="1100" font-family="Arial" font-size="20" font-weight="400" fill="#211b2d">Заявки и выдачи сохраняют историю. Одна карточка каталога соответствует одному экземпляру.</text></svg>